apiVersion: apps/v1
kind: Deployment
metadata:
  name: project14-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project14-web
  template:
    metadata:
      labels:
        app: project14-web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
